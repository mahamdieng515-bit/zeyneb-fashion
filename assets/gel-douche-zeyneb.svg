<text x="350" y="499" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" letter-spacing="3" fill="url(#silver)">FASHION</text>
<text x="350" y="523" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="url(#silver)">GEL DE DOUCHE</text>
