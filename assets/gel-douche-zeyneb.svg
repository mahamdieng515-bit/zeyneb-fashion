<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" role="img" aria-labelledby="title desc">
<title id="title">Gel de douche noir éclaircissant Zeyneb Fashion</title>
<desc id="desc">Flacon noir avec pompe dorée et étiquette noire, or et argent, sans photographie.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f7f4"/><stop offset=".55" stop-color="#e8e5df"/><stop offset="1" stop-color="#c9c5bd"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#050505"/><stop offset=".22" stop-color="#292929"/><stop offset=".4" stop-color="#080808"/><stop offset=".62" stop-color="#242424"/><stop offset=".82" stop-color="#030303"/><stop offset="1" stop-color="#353535"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2b0"/><stop offset=".24" stop-color="#bd8a2c"/><stop offset=".48" stop-color="#ffe18a"/><stop offset=".72" stop-color="#8b641d"/><stop offset="1" stop-color="#f4d17a"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#aeb3b8"/><stop offset=".55" stop-color="#f8f8f8"/><stop offset="1" stop-color="#7a8087"/></linearGradient>
 <filter id="shadow" x="-.4" y="-.3" width="1.8" height="1.8"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="700" height="800" rx="28" fill="url(#bg)"/>
